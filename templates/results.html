<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Library</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
  </head>

  <body>
    <header class="site-header">
      <div class="header-container">
        <h1>
          <a href="/" class="header-logo-link">Photo Library</a>
        </h1>

        <nav class="navbar">
          <ul>
            <li><a href="/">Upload</a></li>
            <li><a href="{{ url_for('photos') }}">Photos</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="main-content">
      <form action="{{ url_for('search') }}" method="GET">
        <div class="search">
          <input
            type="search"
            class="search-input"
            placeholder="Search by label..."
            name="q"
          />
          <button type="submit">Search</button>
        </div>
      </form>

      <section class="card-grid">
        {% for photo in results %}

        <div class="card">
          <div class="card-img">
            <img src="{{ photo.url }}" alt="{{ photo.name }}" />
          </div>

          <div class="card-content">
            <h3 class="title">{{ photo.name }}</h3>

            <div class="labels">
              <b>Tags:</b>

              {% for label in photo.labels %}
              <span class="label">{{ label.name }}</span>
              {% endfor %}
            </div>
            <a href="{{ photo.url }}" class="download-button" title="Download">
              <span class="material-symbols-outlined">download</span>
            </a>
            <form action="{{ url_for('delete') }}" method="POST">
              <input type="hidden" name="name" value="{{ photo.name }}" />

              <button type="submit" class="delete-button" title="Delete">
                <span class="material-symbols-outlined">delete</span>
              </button>
            </form>
          </div>
        </div>

        {% endfor %}
      </section>
    </main>
  </body>
</html>
